[project]
name = "paper-curator"
version = "0.1.0"
description = "A research assistant that collects academic papers from arXiv and answers research questions about them."
readme = "README.md"
license = "MIT"
requires-python = "==3.13.*"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.7",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.0.55",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_curator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607", "S608"]
"migrations/*" = ["S"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations", "dags"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "airflow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dags.*"
disallow_untyped_decorators = false
