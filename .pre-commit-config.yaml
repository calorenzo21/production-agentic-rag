# Tools run from the project's environment, so their versions come from uv.lock and mypy
# can load the pydantic plugin. --no-sync stops uv from re-syncing that environment while
# pre-commit has unstaged changes stashed.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: unsupported
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy
        language: unsupported
        types_or: [python, pyi]
        pass_filenames: false
